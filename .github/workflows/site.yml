name: site

# Builds the documentation site and publishes it to GitHub Pages.
#
# The pages are not kept in git: `tool/build_site.py` assembles them from
# the READMEs and the `doc/` folders of the packages, so the packages stay
# the single source of truth and the site cannot drift from them.
#
# Settings -> Pages -> Source is "GitHub Actions"; the domain lives in
# site/public/CNAME, which the build copies into the output.

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/README.md'
      - 'packages/*/doc/**'
      - 'site/**'
      - 'tool/build_site.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Assemble the pages from the packages
        run: python3 tool/build_site.py

      - name: Install
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
