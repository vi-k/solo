name: gate

# The checks of `AGENTS.md`, run by a machine instead of by a person: the
# commands the regimen asks for before a commit, on the latest stable,
# which is what `docs/conventions.md` says is installed locally.
#
# Not on the floor the packages declare. `sdk: ^3.10.0` is a promise to
# whoever depends on them, not the toolchain here: `pub get` in a
# package's own directory resolves its dev dependencies too, at the newest
# versions the constraints allow, and a lint package may want an SDK above
# the floor. The floor has a job of its own, `floor`, and it does not look
# at the tree: it takes what would be published, without the lint
# packages, and runs that on an SDK pinned to the floor.
#
# Following stable means a release of Dart or Flutter can turn this red
# without a commit. That is the same news the maintainer would get on the
# next local run, a few days earlier.
#
# Five jobs rather than one, and the split is the point. `dart` never
# installs Flutter: that is what keeps `solo` and `async_job` the pure Dart
# they promise to be, because a stray `package:flutter` import would stop
# resolving there and nowhere else. `flutter` covers the package that needs
# it, and the bench of its README and `doc/mixins.md` along with it, whose
# drivers are widget tests. `docs` needs no SDK at all. `snippets` builds
# the code of `packages/solo/doc/vs-bloc.md` and of
# `packages/solo/doc/accumulation.md` with
# `packages/solo/doc/accumulation-rules.md` and runs it. `floor` replays
# the suites from the archives on the lowest SDK the pubspecs admit.
#
# What `floor` proves is what the other four cannot. They resolve the tree:
# every file in it, the dev dependencies along with the rest, the newest
# versions the constraints allow. A user gets the archive, without the dev
# dependencies, and may be on Dart 3.10.0 with `meta` 1.17.0. An annotation
# that came with a later `meta`, a widget that came with a later Flutter, a
# library file kept out of the archive by `.pubignore`, a library that
# imports a dev dependency — each of those is green in the four and red
# there.
#
# What `snippets` proves is narrow and worth stating: that every fragment
# of those documents still compiles against the tree and still runs to the
# end, that a trace quoted in a block is the one the run prints, and that
# the mechanics of each section hold: the drivers check themselves with
# `require` and fail the job when they do not. The bench of `vs-bloc.md`
# holds part of its prose as well, the code spans listed in `QUOTED` and
# the phrases in `SAID`. Prose neither list names, a number in a sentence
# included, is compared with nothing and stays the author's job.
#
# Every driver runs under `FakeAsync`, the clock elapsed rather than waited
# for, so a slow runner changes neither what is printed nor what is checked.
#
# `dart pub publish --dry-run` is run for the list of files an archive
# would hold. What it says about the package is printed, and a dry run
# that exits with a warning fails the step: a library importing a dev
# dependency is one. It is still not release readiness. Between releases
# the tree carries `pubspec_overrides.yaml` files pointing at the packages
# next door, which pub lets through as a hint, and a dry run over those
# does not describe the release that would go out. Readiness is a step of
# the release, and its order is in
# `docs/records/2026-09-11[1]-solo-release-readiness-report.md`.
#
# The records are not covered either: `check_line_width.py` takes
# `packages/`, `docs/` and `AGENTS.md`, and skips `docs/records/` by
# design, so a record stays a reading job, as the regimen says.
#
# Every job names its image, `ubuntu-26.04`, rather than `ubuntu-latest`:
# a label GitHub moves to a new release changes the gate with no commit
# to show for it. Moving to the next image is a commit of its own, here
# and in `site.yml`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes this run pointless.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-26.04
    # The suites take seconds. The ceiling is for a hang, which does not
    # fail on its own: it would hold the concurrency group until GitHub's
    # default of six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # The action's own cache holds the SDK and nothing else, so every run
      # would re-download every package. No lockfile is committed — these
      # are library packages — so the manifests key the cache.
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-dart-${{ runner.os }}-${{ hashFiles('packages/*/pubspec.yaml', 'packages/*/example/pubspec.yaml') }}
          restore-keys: pub-dart-${{ runner.os }}-

      - name: Toolchain
        run: dart --version

      # The example is a package of its own, with a resolution of its own.
      - name: Dependencies
        run: |
          for package in packages/async_job packages/solo packages/solo/example packages/solo_lints; do
            echo "== $package"
            (cd "$package" && dart pub get)
          done

      # First, and with `--output=none`: the cheapest failure to read, and
      # the tree stays as it was checked out, which is what makes the last
      # step of the job mean anything.
      - name: Formatting
        run: |
          (cd packages/async_job && dart format --output=none --set-exit-if-changed lib test example)
          (cd packages/solo && dart format --output=none --set-exit-if-changed lib test example)
          (cd packages/solo_lints && dart format --output=none --set-exit-if-changed lib test)

      # `dart analyze` exits 0 on an info, and two of them once passed this
      # step green. `flutter analyze` fails on one already.
      - name: Analyze
        run: |
          for package in packages/async_job packages/solo packages/solo/example packages/solo_lints; do
            echo "== $package"
            (cd "$package" && dart analyze --fatal-infos)
          done

      - name: Dartdoc
        run: |
          (cd packages/async_job && dart doc --dry-run)
          (cd packages/solo && dart doc --dry-run)
          (cd packages/solo_lints && dart doc --dry-run)

      - name: Tests
        run: |
          for package in packages/async_job packages/solo packages/solo/example packages/solo_lints; do
            echo "== $package"
            (cd "$package" && dart test)
          done

      # `git status --porcelain` rather than `git diff --exit-code`: the
      # latter compares what is tracked and says nothing about a file a step
      # created out of nothing.
      - name: Nothing drifted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  flutter:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-flutter-${{ runner.os }}-${{ hashFiles('packages/*/pubspec.yaml', 'packages/*/example/pubspec.yaml') }}
          restore-keys: pub-flutter-${{ runner.os }}-

      - name: Toolchain
        run: flutter --version

      # The example resolves `solo` and `async_job` through a
      # `pubspec_overrides.yaml` of its own: the overrides of
      # `packages/flutter_solo` do not reach it, because pub applies only
      # the ones belonging to the package it is resolving. Without that file
      # the example analyzed against the published `solo` and said nothing
      # about the tree it lives in.
      - name: Dependencies
        run: |
          for package in packages/flutter_solo packages/flutter_solo/example; do
            echo "== $package"
            (cd "$package" && flutter pub get)
          done

      - name: Formatting
        run: |
          cd packages/flutter_solo
          dart format --output=none --set-exit-if-changed lib test example

      # `flutter analyze` of the package walks the example as well, under
      # the example's own `analysis_options.yaml`. The second run is kept
      # because the regimen lists it, and because a failure then names the
      # package instead of a path. The example names the solo_lints plugin,
      # and from Flutter 3.44 on `flutter analyze` shows none of its
      # diagnostics, so `dart analyze` runs there as well.
      - name: Analyze
        run: |
          (cd packages/flutter_solo && flutter analyze)
          (cd packages/flutter_solo/example && flutter analyze)
          (cd packages/flutter_solo/example && dart analyze --fatal-infos)

      - name: Dartdoc
        run: cd packages/flutter_solo && dart doc --dry-run

      # The example has tests of its own: analysis alone passed it while
      # a failed load left it on a spinner for good.
      - name: Tests
        run: |
          (cd packages/flutter_solo && flutter test)
          (cd packages/flutter_solo/example && flutter test)

      # The bench of the README of `flutter_solo`, of its `doc/mixins.md` and
      # of its `doc/testing.md` runs here rather than in `snippets`, which has
      # no Flutter: what those documents show are widgets, and a widget needs
      # a binding to be built and read back.
      # Outside the checkout, like the other benches, which is what lets the
      # last step of this job mean anything.
      - name: Build the screens out of the document
        run: python3 tool/flutter_snippets.py "$RUNNER_TEMP/doc-check"

      - name: Dependencies of the bench
        run: cd "$RUNNER_TEMP/doc-check/flutter_check" && flutter pub get

      # Under the package's own rules, copied there by the generator: a
      # fragment that passes here is a fragment that would pass inside
      # `packages/flutter_solo`.
      - name: Analyze the bench
        run: cd "$RUNNER_TEMP/doc-check/flutter_check" && flutter analyze

      # One file at a time, and unsilenced. The order of the log is what the
      # step below reads, and a reader of a red run compares the traces by
      # eye in the same place.
      - name: Every screen runs
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/doc-check/flutter_check"
          flutter test --concurrency=1 | tee "$RUNNER_TEMP/flutter.out"

      - name: The quoted traces are the printed ones
        run: |
          python3 tool/check_traces.py \
            packages/flutter_solo/doc/mixins.md "$RUNNER_TEMP/flutter.out"

      # Here and not in `floor`, which is where the layout is used: listing
      # an archive is a dry run of `pub publish`, and that resolves the
      # package where it stands, lint packages included, which the floor
      # cannot do. This job has the one SDK that resolves all four.
      - name: Lay out what would be published
        run: python3 tool/archive_floor.py stage "$RUNNER_TEMP/archive"

      - uses: actions/upload-artifact@v7
        with:
          name: archive
          path: ${{ runner.temp }}/archive
          # Long enough to run `floor` again by itself a few days later.
          retention-days: 7
          if-no-files-found: error

      - name: Nothing drifted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  floor:
    needs: flutter
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # For the script alone: what it runs comes from the artifact.
      - uses: actions/checkout@v7

      # The floor of both: Flutter 3.38.1 carries Dart 3.10.0, the `sdk`
      # the four pubspecs declare. Not 3.38.0, which carries a beta build
      # of 3.10.0 that `^3.10.0` does not admit. The script reads the
      # pubspecs and refuses any other SDK, so a floor raised in a pubspec
      # and not here is a red job, not a check of the wrong thing.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.1
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-floor-${{ runner.os }}-${{ hashFiles('packages/*/pubspec.yaml', 'packages/*/example/pubspec.yaml') }}
          restore-keys: pub-floor-${{ runner.os }}-

      - name: Toolchain
        run: flutter --version

      - uses: actions/download-artifact@v8
        with:
          name: archive
          path: ${{ runner.temp }}/archive

      # Each package and its example, twice. As a dependency: without its
      # dev dependencies, `meta` taken down to the lowest version the
      # constraint allows, analyzed for errors, its program run. Then with
      # its tests. A red test is printed whole: it does not reproduce on
      # stable, and its name is all there is to go by.
      - name: The archives pass their gate on the floor
        run: python3 tool/archive_floor.py run "$RUNNER_TEMP/archive"

      - name: Nothing drifted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  snippets:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Packages of its own making: bloc 9 with `bloc_concurrency`, riverpod
      # 3, http and dio on top of what the other Dart job pulls. The
      # generators carry the manifests, so they key the cache along with the
      # packages they resolve by path.
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-snippets-${{ runner.os }}-${{ hashFiles('tool/doc_snippets.py', 'tool/accumulation_snippets.py', 'tool/adapter_snippets.py', 'tool/doc_blocks.py', 'packages/*/pubspec.yaml') }}
          restore-keys: pub-snippets-${{ runner.os }}-

      # Outside the checkout, which is what lets the last step of this job
      # mean anything: the benches write four packages and never the tree.
      - name: Build the benches out of the documents
        run: |
          python3 tool/doc_snippets.py "$RUNNER_TEMP/doc-check"
          python3 tool/accumulation_snippets.py "$RUNNER_TEMP/doc-check"
          python3 tool/adapter_snippets.py "$RUNNER_TEMP/doc-check"

      - name: Dependencies
        run: |
          for package in bloc_check solo_check accumulation_check adapters_check; do
            echo "== $package"
            (cd "$RUNNER_TEMP/doc-check/$package" && dart pub get)
          done

      # `solo_check` analyzes under the package's own `analysis_options.yaml`,
      # copied there by the generator: a fragment that passes here is a
      # fragment that would pass inside `packages/solo`. `accumulation_check`
      # takes the same rules with `one_member_abstracts` off, and says why in
      # the file it writes. `adapters_check` takes the rules of `async_job`.
      - name: Analyze
        run: |
          for package in bloc_check solo_check accumulation_check adapters_check; do
            echo "== $package"
            (cd "$RUNNER_TEMP/doc-check/$package" && dart analyze --fatal-infos bin/v)
          done

      # Unsilenced on purpose. These are the traces the documents quote,
      # and the log is where a reader of a red run compares them by eye. The
      # output is kept as well, for the step below to compare by machine.
      - name: Every scenario runs
        run: |
          set -eo pipefail
          : > "$RUNNER_TEMP/vs-bloc.out"
          : > "$RUNNER_TEMP/accumulation.out"
          : > "$RUNNER_TEMP/adapters.out"
          for package in bloc_check solo_check accumulation_check adapters_check; do
            cd "$RUNNER_TEMP/doc-check/$package"
            if [ "$package" = accumulation_check ]; then
              out="$RUNNER_TEMP/accumulation.out"
            elif [ "$package" = adapters_check ]; then
              out="$RUNNER_TEMP/adapters.out"
            else
              out="$RUNNER_TEMP/vs-bloc.out"
            fi
            for driver in bin/v/*.dart; do
              echo "== $package/$driver"
              dart run "$driver" | tee -a "$out"
            done
          done

      # The benches prove every fragment builds against the tree and runs.
      # This proves the other half: that a trace quoted next to a fragment
      # is the trace that fragment prints, and not one that used to be true.
      - name: The quoted traces are the printed ones
        run: |
          python3 tool/check_traces.py \
            packages/solo/doc/vs-bloc.md "$RUNNER_TEMP/vs-bloc.out" \
            packages/solo/doc/accumulation.md "$RUNNER_TEMP/accumulation.out" \
            packages/solo/doc/accumulation-rules.md "$RUNNER_TEMP/accumulation.out" \
            packages/async_job/doc/riverpod-and-bloc.md "$RUNNER_TEMP/adapters.out"

      - name: Nothing drifted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # It also reports a second blank line in a row outside code: the
      # site renders the two as one, so only the source shows them.
      - name: Line width and doubled blank lines
        run: python3 tool/check_line_width.py

      # And this says which wide line is an offence: one a fill could
      # still narrow, not one holding a link or a span it cannot split.
      - name: The width check knows an unbreakable token
        run: python3 -m unittest tool/check_line_width_test.py

      # The width check says no line is too long; this one says no line is
      # too short. A paragraph is filled greedily, so where the break falls
      # is not a decision anyone has to make or review.
      - name: Paragraphs are filled
        run: python3 tool/reflow.py --check

      # The check above trusts the filler. These say what a fill must never
      # reshape: a nested list glued into one line, a paragraph pulled out
      # of its item to column 0.
      - name: The filler keeps lists
        run: python3 -m unittest tool/reflow_test.py

      - name: A section starts with code, an attempt with its mark
        run: python3 tool/check_doc_shape.py

      # Each review wave cut the long dartdoc its reviewer named, and the
      # next review found the next one. This holds the shape of decision
      # 103: one sentence first, short paragraphs, a short block.
      - name: Public dartdoc is a hint
        run: python3 tool/check_dartdoc.py

      - name: The dartdoc check knows a long one
        run: python3 -m unittest tool/check_dartdoc_test.py

      # The rakes tests of four packages hold their pages to one helper,
      # kept in four copies. A fix that reached three of them would leave
      # the fourth checking its pages by the old rule, and green.
      - name: The copies of page_code.dart agree
        run: python3 tool/check_page_code.py

      # The `floor` job trusts this script to say which files make an
      # archive and which SDK is the floor. These hold both.
      - name: The floor check reads pub and the pubspecs right
        run: python3 -m unittest tool/archive_floor_test.py

      - name: Translations answer their originals
        run: python3 tool/check_translations.py

      # A link is a promise that a file and a section exist. Renaming
      # either of them stayed green until a reader clicked.
      - name: Links resolve
        run: python3 tool/check_links.py

      # And this says the check above knows a broken link when it sees
      # one: a missing file, a reworded heading, a repetition that is
      # not there.
      - name: The link check knows a broken link
        run: python3 -m unittest tool/check_links_test.py

      # A link that resolves in the tree can still land nowhere on the
      # site: a section of another package lost its anchor there, and a
      # Russian page of `async_job` became a page of `solo`.
      - name: Links land where they point on the site
        run: python3 -m unittest tool/build_site_test.py

      # Not a duplicate of `site.yml`: that one runs after a merge and only
      # for the paths it watches. Here the assembly is a smoke test — a page
      # that cannot be assembled fails before the merge, not after it.
      - name: The site assembles
        run: python3 tool/build_site.py

      # The assembled pages land in `site/src/content/docs/`, which is
      # ignored, so this still holds.
      - name: Nothing drifted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
