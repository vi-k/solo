name: solo_example
description: A fake camera controller built on solo.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  meta: ^1.15.0
  solo:
    path: ../

# A root package applies no override of its dependency, so the path to the
# unpublished `jobs` has to be repeated here.
dependency_overrides:
  jobs:
    path: ../../jobs

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^5.1.1
  test: ^1.26.3
