# A root package applies no override of its dependency, so the path to
# the unpublished `async_job` is repeated here. This file is not published:
# `example/` ships inside the package, and `../../async_job` does not exist
# in the archive. Delete it once `async_job` is on pub.dev.
dependency_overrides:
  async_job:
    path: ../../async_job
