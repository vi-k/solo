name: solo
description: >-
  One job at a time: sequential jobs with exclusive state ownership,
  declarative rules and cooperative cancellation. Pure Dart.
version: 0.5.0
repository: https://github.com/vi-k/solo/tree/main/packages/solo
issue_tracker: https://github.com/vi-k/solo/issues
topics:
  - state-management
  - async
  - cancellation
  - concurrency

environment:
  sdk: ^3.10.0

dependencies:
  async_job: ^0.5.0
  meta: ^1.17.0

dev_dependencies:
  clock: ^1.1.2
  fake_async: ^1.3.3
  lints: ^6.1.0
  test: ^1.31.1
  test_api: ^0.7.12
