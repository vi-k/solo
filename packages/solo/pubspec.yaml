name: solo
description: >-
  One job at a time: sequential jobs with exclusive state ownership,
  declarative rules and cooperative cancellation. Pure Dart.
version: 0.2.0
repository: https://github.com/vi-k/solo/tree/main/packages/solo

environment:
  sdk: ^3.6.0

dependencies:
  jobs: ^0.1.0
  meta: ^1.15.0

# Until `jobs` is published; the same shape `flutter_solo` uses for `solo`.
dependency_overrides:
  jobs:
    path: ../jobs

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^5.1.1
  test: ^1.26.3
