name: flutter_solo
description: >-
  State management for Flutter: sequential jobs, exclusive state ownership,
  cooperative cancellation, rebuilds through SoloBuilder or ValueListenable.
version: 0.6.0
repository: https://github.com/vi-k/solo/tree/main/packages/flutter_solo
issue_tracker: https://github.com/vi-k/solo/issues
topics:
  - state-management
  - async
  - cancellation
  - concurrency

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  solo: ^0.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  meta: ^1.17.0
  scopo: ^0.21.0
