name: flutter_solo
description: >-
  State management for Flutter: sequential jobs, exclusive state ownership,
  cooperative cancellation, rebuilds through ValueListenable.
version: 0.2.0
repository: https://github.com/vi-k/solo/tree/main/packages/flutter_solo
issue_tracker: https://github.com/vi-k/solo/issues
topics:
  - state-management
  - async
  - cancellation
  - concurrency

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  solo: ^0.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
