name: async_job
description: >-
  Cancel async work in Dart: cooperative cancellation, child tasks,
  resource cleanup and explicit outcomes, in the manner of structured
  concurrency. Pure Dart.
version: 0.6.0
repository: https://github.com/vi-k/solo/tree/main/packages/async_job
documentation: https://docs.yet-another.dev/async_job/
issue_tracker: https://github.com/vi-k/solo/issues
topics:
  - async
  - cancellation
  - concurrency
  - dispose
  - structured-concurrency

environment:
  sdk: ^3.10.0

dependencies:
  meta: ^1.17.0

dev_dependencies:
  async: ^2.13.1
  fake_async: ^1.3.3
  lints: ^6.1.0
  test: ^1.31.1
